<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Case for Public Participation in Science and Technology Policy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%94%AC</text></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header id="top">
  <button id="nav-btn" aria-expanded="false" aria-controls="drawer">
    <span class="nav-ico"><i></i><i></i><i></i></span>
    <span class="nav-lbl">Cases</span>
  </button>
  <div id="top-case">
    <span id="top-num"></span>
    <span id="top-title-row">
      <span id="top-title"></span>
      <span class="top-info">
        <button id="top-info-btn" aria-label="About this case" aria-expanded="false" aria-controls="top-info-pop">i</button>
        <div id="top-info-pop" role="tooltip"></div>
      </span>
    </span>
  </div>
</header>

<div id="drawer-backdrop"></div>
<aside id="drawer" aria-hidden="true">
  <div class="dr-head">
    <div class="dr-site">The Case for Public Participation in Science and Technology Policy</div>
    <button id="drawer-close" aria-label="Close">&times;</button>
  </div>
  <nav id="drawer-cases"></nav>
</aside>

<aside id="key-panel" aria-hidden="true">
  <div class="kp-head">
    <span>Key</span>
    <button id="key-close" aria-label="Close">&times;</button>
  </div>
  <div id="key-txt"></div>
</aside>

<div id="tl-wrap">
  <div class="tl-toolbar">
    <button class="fl fl-all" data-f="all">All</button>
    <button class="fl fl-red" data-f="red">Policy</button>
    <button class="fl fl-orange" data-f="orange">Events</button>
    <button class="fl fl-green" data-f="green">Knowledge</button>
    <button class="fl fl-blue" data-f="blue">Public Opinion</button>
    <button class="fl fl-purple" data-f="purple">Public Participation</button>
    <button class="tl-back" id="tl-back" data-view="spine">&larr; Back to Map</button>
  </div>
  <div class="tl-scroll">
    <div class="tl-inner"></div>
  </div>
</div>

<div id="ch-wrap">
  <div id="ch-mapcol">
    <div id="ch-sel"></div>
    <div id="ch-mapwrap">
      <div id="ch-map"></div>
      <div id="ch-zoom" role="group" aria-label="Zoom">
        <button data-zoom="out" aria-label="Zoom out">&minus;</button>
        <button data-zoom="reset" id="zoom-lbl" aria-label="Reset zoom">100%</button>
        <button data-zoom="in" aria-label="Zoom in">+</button>
      </div>
    </div>
    <div id="ch-legend">
      <span class="lg-hd">Main Timeline</span>
      <span class="lg-row">
        <span class="lg-dot"><i class="k-sw k-sw-sp-ent"></i>Timeline Event</span>
        <span class="lg-dot"><i class="k-sw k-sw-sp-star"></i>Existing Mechanism</span>
        <span class="lg-dot"><i class="k-sw k-sw-sp-imp"></i>Measured Impact</span>
      </span>
      <span class="lg-hd">Proposals & Evidence</span>
      <span class="lg-row">
        <span class="lg-dot"><i class="k-sw k-sw-sp-prop"></i>Proposed Public Participation</span>
        <span class="lg-dot"><i class="k-sw k-sw-sp-chain"></i>Causal Link</span>
        <span class="lg-dot"><i class="k-sw k-sw-sp-chain-un"></i>Untested Link</span>
        <span class="lg-dot"><i class="k-sw k-sw-sp-flag"></i>Evidence</span>
        <span class="lg-dot"><i class="k-sw k-sw-sp-ctr"></i>Counter-Evidence</span>
        <button class="lg-more" data-openkey>Full Key &rarr;</button>
      </span>
      <button id="legend-hide" aria-controls="ch-legend"
        aria-expanded="true" aria-label="Hide the key" title="Hide the key">&#x2715;</button>
    </div>
    <button id="legend-show" class="pane-tog pane-tog-strip" hidden
      aria-controls="ch-legend" aria-expanded="false"
      title="Show the key">Open Key &#x2303;</button>
  </div>
  <div id="ch-right">
    <div id="ch-right-tabs">
      <span class="rt-label">Causal Chains</span>
      <button id="tl-expand" data-view="timeline" title="Open the full timeline with filters and the case overview">Expand Timeline <svg class="ico-expand" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M7 1h4v4M11 1 6.5 5.5M5 11H1V7M1 11l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="right-hide" class="pane-tog" aria-controls="ch-right"
        aria-expanded="true" aria-label="Hide the detail pane" title="Hide the detail pane">&#x2715;</button>
    </div>
    <div id="ch-detail" class="rt-pane show"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
